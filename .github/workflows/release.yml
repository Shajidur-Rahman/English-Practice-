name: Release English Practice APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.0)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests & build APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare release asset
        run: |
          mkdir -p release_out
          cp app/build/outputs/apk/debug/app-debug.apk release_out/EnglishPractice.apk

      - name: Resolve tag name
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: English Practice ${{ steps.meta.outputs.tag }}
          body: |
            ## English Practice ${{ steps.meta.outputs.tag }}
            - **Articles:** 76 passages (760 blanks)
            - **Prepositions:** 80 passages (800 blanks)
            - **Mother's Test:** Read-only oral testing with customizable layouts (5+5, 1-line, 2-line, Full Page, scalable text) & ✨ Magic real book solution verification
            - **Flash Memory DB:** SQLite SM-2 spaced repetition mistake bank
          files: release_out/EnglishPractice.apk
